name: Diagnostico Binance (temporal)
on:
  push:
    branches: [claude/nice-maxwell-o13it6]
    paths: [.github/workflows/diagnostico.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probar endpoints
        run: |
          curl -s https://ipinfo.io/json || true
          echo
          for u in \
            "https://api.binance.com/api/v3/ping" \
            "https://api1.binance.com/api/v3/ping" \
            "https://api-gcp.binance.com/api/v3/ping" \
            "https://data-api.binance.vision/api/v3/ping" \
            "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=2" \
            "https://fapi.binance.com/fapi/v1/ping" \
            "https://fapi1.binance.com/fapi/v1/ping" \
            "https://www.binance.com/fapi/v1/ping" \
            "https://www.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1d&limit=2" \
            "https://www.binance.com/api/v3/ping" \
            "https://data.binance.vision/?prefix=data/futures/um/daily/klines/" \
            "https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/1d/BTCUSDT-1d-2026-08.zip" \
            "https://dapi.binance.com/dapi/v1/ping" ; do
            code=$(curl -s -o body.txt -w "%{http_code}" -m 20 "$u" || echo ERR)
            echo "== $code  $u"
            head -c 300 body.txt; echo
          done

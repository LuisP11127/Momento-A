name: Scanner

# Tests y un escaneo real desde los servidores de GitHub. Se lanza a mano en Actions → Scanner → Run
# workflow (con los filtros como opciones) y, además, en cada pull request y en cada cambio en main.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["docs/seguimiento/**"]  # los guardados del seguimiento no cambian el código
  workflow_dispatch:
    inputs:
      mercado:
        description: Mercados a escanear
        type: choice
        options: [ambos, spot, futuros]
        default: ambos
      intervalo:
        description: Temporalidad de las velas
        type: choice
        options: ["15m", "30m", "1h", "2h", "4h", "6h", "8h", "12h", "1d", "1w"]
        default: "1d"
      tolerancia:
        description: "% máximo por debajo de la MA(7) para contar como 'muy cerca'"
        type: string
        default: "2"
      max_encima:
        description: "% máximo por encima de la MA(7) (vacío = sin límite)"
        type: string
        default: ""
      volumen_min:
        description: Volumen mínimo en 24 h (en USDT)
        type: string
        default: "0"
      orden:
        description: Orden de los resultados
        type: choice
        options: [fuerza, cruce, ma7, bajista, volumen, variacion, simbolo]
        default: fuerza
      sin_ma99:
        description: No exigir MA25 < MA99 (basta con MA7 < MA25)
        type: boolean
        default: false
      permitir_roja:
        description: Incluir también velas rojas
        type: boolean
        default: false
      vela_cerrada:
        description: Evaluar la última vela cerrada en vez de la vela en curso
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # La web guarda en el navegador la clave de GitHub del seguimiento: la librería de gráficos
      # se carga con una huella (SRI) y aquí se comprueba que coincide con el archivo del CDN.
      - name: Comprobar la huella de la librería de gráficos
        shell: python
        run: |
          import base64, hashlib, re, urllib.request
          html = open("momento_a/report_template.html", encoding="utf-8").read()
          src, integrity = re.search(r'<script src="(https://[^"]+)" integrity="([^"]+)"', html).groups()
          data = urllib.request.urlopen(src, timeout=60).read()
          digest = "sha384-" + base64.b64encode(hashlib.sha384(data).digest()).decode()
          print(src, digest)
          assert digest == integrity, f"la huella no coincide: {digest} != {integrity}"

  scan:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escanear Binance
        env:
          MERCADO: ${{ inputs.mercado || 'ambos' }}
          INTERVALO: ${{ inputs.intervalo || '1d' }}
          TOLERANCIA: ${{ inputs.tolerancia || '2' }}
          MAX_ENCIMA: ${{ inputs.max_encima }}
          VOLUMEN_MIN: ${{ inputs.volumen_min || '0' }}
          ORDEN: ${{ inputs.orden || 'fuerza' }}
          SIN_MA99: ${{ inputs.sin_ma99 }}
          PERMITIR_ROJA: ${{ inputs.permitir_roja }}
          VELA_CERRADA: ${{ inputs.vela_cerrada }}
        run: |
          args=(--mercado "$MERCADO" --intervalo "$INTERVALO" --tolerancia "$TOLERANCIA" --volumen-min "$VOLUMEN_MIN" --orden "$ORDEN")
          if [ -n "$MAX_ENCIMA" ]; then args+=(--max-encima "$MAX_ENCIMA"); fi
          if [ "$SIN_MA99" = "true" ]; then args+=(--sin-ma99); fi
          if [ "$PERMITIR_ROJA" = "true" ]; then args+=(--permitir-roja); fi
          if [ "$VELA_CERRADA" = "true" ]; then args+=(--vela-cerrada); fi
          mkdir -p reportes
          python -m momento_a "${args[@]}" --markdown "$GITHUB_STEP_SUMMARY" \
            --csv reportes/momento-a.csv --json reportes/momento-a.json --html reportes/momento-a.html
          {
            echo
            echo "Informe con los gráficos en **Artifacts → momento-a**, al final de esta página: abre \`momento-a.html\`, o carga \`momento-a.json\` en la web con **Cargar informe**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el informe
        uses: actions/upload-artifact@v6
        with:
          name: momento-a
          path: reportes/
          retention-days: 30
